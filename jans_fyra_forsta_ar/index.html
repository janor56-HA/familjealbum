<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Jans fyra första år – bläddringsalbum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: #050505;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }

    header, footer {
      padding: 8px 12px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #222;
    }

    footer {
      border-bottom: none;
      border-top: 1px solid #222;
    }

    header > div:first-child {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header .hint {
      font-size: 0.8rem;
      opacity: 0.75;
      text-align: right;
    }

    .viewer {
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 6px;
    }

    #book {
      width: 100%;
      height: 100%;
      max-width: 1400px;
      max-height: 90vh;
      margin: 0 auto;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s ease-out;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      background: #252525;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }
