<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Familjealbum – Översikt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #222 0, #050505 55%);
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #333;
      background: rgba(5,5,5,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    main {
      padding: 16px 20px 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .search {
      flex: 1 1 200px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(20,20,20,0.9);
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid #333;
    }

    .search input {
      border: none;
      outline: none;
      background: transparent;
      color: inherit;
      padding: 4px;
      width: 100%;
      font-size: 0.9rem;
    }

    .badge-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #444;
      background: rgba(15,15,15,0.9);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill.active {
      border-color: #888;
      background: rgba(40,40,40,0.95);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr); /* default: 1 kolumn */
      gap: 16px;
      margin-top: 16px;
    }

    @media (min-width: 900px) {
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)); /* 2 kolumner på större skärmar */
      }
    }

    .card {
      display: grid;
      grid-template-columns: 160px 1fr;   /* miniatyrvänster + text till höger */
      gap: 12px;
      background: rgba(15,15,15,0.9);
      border-radius: 14px;
      border: 1px solid #333;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out, border-color 0.12s ease-out;
      text-decoration: none;
      color: inherit;
      align-items: center;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-color: #555;
    }

    .card h2 {
      margin: 0;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #444;
      background: rgba(30,30,30,0.9);
      align-self: flex-start;
    }

    .year {
      font-weight: 600;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 999px;
      border: 1px solid #555;
      background: rgba(60,60,60,0.9);
      margin-top: 4px;
    }

    .cover {
      width: 100%;
      height: 120px;                /* samma som grid-kolumnens bredd */
      background-size: cover;      /* eller contain */
      background-position: top;
      background-repeat: no-repeat;
      border-radius: 8px;
      background-color: #000;
    }

    .card-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      padding: 12px 8px 18px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.2rem; }
      main { padding: 12px 12px 24px; }
    }
  </style>
</head>
<body>
<header>
  <h1>📚 Familjealbum</h1>
  <p>Klicka på ett album för att öppna det. Fungerar på både dator och mobil.</p>
</header>

<main>
  <div class="toolbar">
    <div class="search">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Sök album (titel, år, beskrivning)..." />
    </div>
    <div class="badge-filter">
      <button class="pill active" data-filter="all">Alla</button>
      <button class="pill" data-filter="barn">👶 Barn & uppväxt</button>
      <button class="pill" data-filter="hogtid">🎉 Högtider</button>
      <button class="pill" data-filter="resa">✈️ Resor</button>
      <button class="pill" data-filter="annat">📂 Övrigt</button>
    </div>
  </div>

  <div class="grid" id="albumGrid"></div>
</main>

<footer>
  Privat familjearkiv – publicerat via GitHub Pages. Version: 1.10 (2025-12-07)
</footer>

<script>
  // === jano, janne Här lägger du in dina album ===
  const albums = [
    {
      id: "jans_fyra_forsta_ar",          // mappnamn
      title: "Jans fyra första år",
      description: "De första åren.",
      year: "1956–1960",
      category: "barn",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    },
    {
      id: "gotland_1983",          // mappnamn
      title: "Gotland 1983",
      description: "Sommaren 1983 på Gotland under 3 veckor.",
      year: "1989-1992",
      category: "resa",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    },
    { 
      id: "sandra_dop_1984",          // mappnamn
      title: "Sandras dop 1984",
      description: "Sandra döptes 5 maj 1984 i Järfälla kyrka.",
      year: "1984",
      category: "barn",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    },
    { 
      id: "1984-1985",          // mappnamn
      title: "1984 - 1985",
      description: "Diverse händelser under åren.",
      year: "1984",
      category: "barn",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    },
    { 
      id: "batsemester_1985",          // mappnamn
      title: "Båtsemester med Halfwordon 1985",
      description: "Hyrde en stålbåt som vi semestrade med.",
      year: "1985",
      category: "resa",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    },
    {
      id: "ringso_1989-1992",          // mappnamn
      title: "Ringsö åren 1989 - 1992",
      description: "De första åren, mest röjning och byggnation.",
      year: "1989-1992",
      category: "annat",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    },
    {
      id: "ringso_1990",          // mappnamn
      title: "Ringsö år 1990",
      description: "De första åren, mest byggnation.",
      year: "1990",
      category: "annat",                    // barn / hogtid / resa / annat
      cover: "images/page-1.jpg"         // relativt album-mappen
    }
    // Lägg till fler objekt:
    // {
    //   id: "anders-konfirmation",
    //   title: "Anders konfirmation",
    //   description: "Konfirmation och firande med släkten.",
    //   year: "1982",
    //   category: "hogtid",
    //   cover: "images/page-1.jpg"
    // }
  ];

  const grid = document.getElementById('albumGrid');
  const searchInput = document.getElementById('searchInput');
  const filterButtons = Array.from(document.querySelectorAll('.pill'));

  function renderAlbums() {
    const term = searchInput.value.toLowerCase().trim();
    const activeFilter = filterButtons.find(b => b.classList.contains('active'))?.dataset.filter || 'all';

    grid.innerHTML = "";

    albums
      .filter(album => {
        if (activeFilter !== 'all' && album.category !== activeFilter) return false;
        if (!term) return true;
        const haystack = (album.title + " " + album.description + " " + album.year).toLowerCase();
        return haystack.includes(term);
      })
      .forEach(album => {
        const link = document.createElement('a');
        link.className = 'card';
        link.href = `viewer.html?album=${album.id}`;

        const coverStyle = album.cover
          ? `style="background-image:url('${album.id}/${album.cover}');"`
          : "";

    const coverUrl = `${album.id}/${album.cover}`;

    link.innerHTML = `
       <div class="cover" style="background-image:url('${coverUrl}')"></div>
      <div class="card-inner">
        <h2>📖 <span>${album.title}</span></h2>
        <div class="meta">
          <span class="year">${album.year}</span>
          <span class="badge">${labelForCategory(album.category)}</span>
        </div>
        <p>${album.description}</p>
      </div>
    `;

        grid.appendChild(link);
      });

    if (!grid.children.length) {
      grid.innerHTML = `<p style="opacity:0.8;">Inga album matchade sökningen.</p>`;
    }
  }

  function labelForCategory(cat) {
    switch (cat) {
      case "barn": return "Barn & uppväxt";
      case "hogtid": return "Högtider";
      case "resa": return "Resor";
      default: return "Övrigt";
    }
  }

  searchInput.addEventListener('input', () => renderAlbums());

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAlbums();
    });
  });

  renderAlbums();
</script>
</body>
</html>
