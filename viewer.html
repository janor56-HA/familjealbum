<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Familjealbum – bläddringsvisning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050505;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; /* Vi sköter scroll inom viewer */
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }

    header, footer {
      padding: 8px 12px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    footer { border-bottom: none; border-top: 1px solid #222; }

    header .hint {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    /* Viewer = scrollzon för mobil + desktop */
    .viewer {
      position: relative;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 6px;
    }

    #book {
      width: 100%;
      max-width: 1400px;
      height: auto;   /* PageFlip skalar rätt */
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      transition: transform 0.15s ease-out;
    }

    #panLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Loader */
    #loader {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(20,20,20,.9) 0, rgba(0,0,0,.85) 60%);
      display: grid;
      place-items: center;
      z-index: 10;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      background: #252525;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }
    button:hover { background: #333; }
    button:active { transform: scale(0.97); }

    @media (max-width: 768px) {
      header, footer {
        flex-direction: column;
        gap: 6px;
      }
      header .hint { display: none; }
      .controls { justify-content: center; }
      button { flex: 1 1 auto; }

      /* Albumet ska aldrig växa för stort på mobil */
      #book { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div>📖 <strong id="albumTitle">Album</strong></div>
    <div class="hint">Dator: ⬅️ ➡️ • Mobil: svep</div>
  </header>

  <div class="viewer">
    <div id="book"></div>
    <div id="panLayer"></div>

    <div id="loader">
      <div style="display:grid; gap:10px; place-items:center;">
        <div id="loaderText">Läser in albumet…</div>
        <progress id="prog" max="100" value="0"></progress>
        <div id="status">0%</div>
      </div>
    </div>
  </div>

  <footer>
    <div class="controls" id="controlRow">
      <button id="prev">← Föregående</button>
      <button id="next">Nästa →</button>
      <button id="zoomOut">– Zoom</button>
      <button id="zoomIn">+ Zoom</button>
      <button id="zoomReset">↺ Reset zoom</button>
      <button id="fullscreen">⛶ Helskärm</button>
      <button onclick="location.href='index.html'">🏠 Tillbaka</button>
    </div>
    <div class="hint">
      Sida <span id="page">–</span> / <span id="pages">–</span>
    </div>
  </footer>
</div>

<script src="libs/page-flip.browser.js"></script>

<script>
(async function () {

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // --- Album-id från URL ---
  const params = new URLSearchParams(window.location.search);
  const albumId = params.get("album");
  if (!albumId) {
    document.getElementById("loaderText").textContent = "Inget album angivet.";
    return;
  }

  // --- Läs config.json ---
  let config;
  try {
    const res = await fetch(`${albumId}/config.json`);
    if (!res.ok) throw new Error();
    config = await res.json();
  } catch (e) {
    document.getElementById("loaderText").textContent = "Fel i config.json.";
    return;
  }

  const title      = config.title || albumId;
  const PAGE_COUNT = config.pageCount;
  const IMAGE_PATH = config.imagePath || "images";
  const pattern    = config.filePattern || "page-{n}.jpg";

  function buildFileName(i) {
    return pattern
      .replace("{nnn}", String(i).padStart(3, "0"))
      .replace("{nn}",  String(i).padStart(2, "0"))
      .replace("{n}",   String(i));
  }

  const FILE_PATTERN = i => `${albumId}/${IMAGE_PATH}/${buildFileName(i)}`;

  document.getElementById("albumTitle").textContent = title;
  document.title = `${title} – bläddringsalbum`;
  document.getElementById("pages").textContent = PAGE_COUNT;

  // --- Förladdning ---
  const loader = document.getElementById("loader");
  const prog   = document.getElementById("prog");
  const status = document.getElementById("status");

  const FIRST_PRELOAD = 8;
  const images = Array.from({ length: PAGE_COUNT }, (_, i) => FILE_PATTERN(i + 1));

  let loaded = 0;

  function preloadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = resolve;
      img.onerror = resolve;
      img.src = src;
    }).then(() => {
      loaded++;
      const need = Math.min(FIRST_PRELOAD, PAGE_COUNT);
      const pct = Math.round((loaded / need) * 100);
      prog.value = pct;
      status.textContent = pct + "%";
    });
  }

  await Promise.all(images.slice(0, FIRST_PRELOAD).map(preloadImage));
  status.textContent = "100%";

  // --- PageFlip ---
  const bookEl = document.getElementById("book");

  const pageFlip = new St.PageFlip(bookEl, {
    width: 800,
    height: 1100,
    size: "stretch",
    autoSize: true,
    minWidth: 300,
    minHeight: 400,
    showCover: true
  });

  pageFlip.loadFromImages(images);
  loader.style.display = "none";

  document.getElementById("page").textContent = pageFlip.getCurrentPageIndex() + 1;
  pageFlip.on("flip", e => {
    document.getElementById("page").textContent = e.data + 1;
  });

  // --- Zoom + Pan ---
  let zoom = 1, panX = 0, panY = 0;
  const panLayer = document.getElementById("panLayer");

  function updateTransform() {
    const w = bookEl.clientWidth;
    const h = bookEl.clientHeight;

    const maxX = (w * (zoom - 1)) / 2;
    const maxY = (h * (zoom - 1)) / 2;

    if (zoom <= 1) {
      zoom = 1;
      panX = 0;
      panY = 0;
      panLayer.style.pointerEvents = "none";
    } else {
      panX = clamp(panX, -maxX, maxX);
      panY = clamp(panY, -maxY, maxY);
      panLayer.style.pointerEvents = "auto";
    }

    bookEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  document.getElementById("zoomIn").onclick = () => { zoom = clamp(zoom + 0.2, 1, 2.5); updateTransform(); };
  document.getElementById("zoomOut").onclick = () => { zoom = clamp(zoom - 0.2, 1, 2.5); updateTransform(); };
  document.getElementById("zoomReset").onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };

  // Pan (touch & mus)
  let dragging = false, startX, startY, baseX, baseY;

  panLayer.addEventListener("pointerdown", e => {
    if (zoom <= 1) return;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    baseX = panX;
    baseY = panY;
    panLayer.setPointerCapture(e.pointerId);
  });

  panLayer.addEventListener("pointermove", e => {
    if (!dragging) return;
    panX = baseX + (e.clientX - startX);
    panY = baseY + (e.clientY - startY);
    updateTransform();
  });

  panLayer.addEventListener("pointerup", () => dragging = false);
  panLayer.addEventListener("pointercancel", () => dragging = false);

  // --- Helskärm (endast desktop)
  const fullscreenBtn = document.getElementById("fullscreen");
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  if (isTouch) fullscreenBtn.style.display = "none";

  fullscreenBtn.onclick = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) el.requestFullscreen?.();
    else document.exitFullscreen?.();
  };

  // --- Navigering ---
  document.getElementById("prev").onclick = () => pageFlip.flipPrev();
  document.getElementById("next").onclick = () => pageFlip.flipNext();

})();
</script>
</body>
</html>
