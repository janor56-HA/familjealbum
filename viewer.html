<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Familjealbum – bläddringsvisning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050505;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; /* ingen global scroll – vi håller allt i viewporten */
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto; /* header – viewer – footer */
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }

    header, footer {
      padding: 8px 12px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    footer {
      border-bottom: none;
      border-top: 1px solid #222;
    }

    header > div:first-child {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header .hint {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .viewer {
      position: relative;
      overflow: hidden;           /* inget scroll här – albumet får plats i höjd */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
    }

    #book {
      width: 100%;
      max-width: 1400px;
      height: 100%;
      max-height: 100%;          /* fyll viewer, men aldrig högre än viewer */
      margin: 0 auto;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s ease-out;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;        /* vi styr drag själva när zoom > 1 */
    }

    #panLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;      /* aktiveras i JS när zoom > 1 */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(20,20,20,.9) 0, rgba(0,0,0,.85) 60%);
      color: #ddd;
      font-size: 1rem;
      z-index: 10;
      text-align: center;
      padding: 16px;
    }

    progress {
      width: 240px;
      max-width: 70vw;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }
    progress::-webkit-progress-bar { background-color: #333; }
    progress::-webkit-progress-value { background-color: #f0f0f0; }
    progress::-moz-progress-bar { background-color: #f0f0f0; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      background: #252525;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    button.small {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    button:hover { background: #333; }
    button:active { transform: scale(0.97); }

    footer .hint {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      header, footer {
        padding: 6px 8px;
      }

      header {
        flex-direction: row;
      }

      header .hint {
        display: none; /* spara höjd på mobil */
      }

      .controls {
        justify-content: center;
        flex-wrap: nowrap;  /* vi försöker hålla allt på EN rad */
      }

      button {
        font-size: 0.8rem;
        padding: 5px 8px;
      }

      button.small {
        font-size: 0.7rem;
        padding: 3px 6px;
      }

      #book {
        max-width: 100%;
      }

      footer {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      footer .hint {
        text-align: right;
        font-size: 0.75rem;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>📖 <strong id="albumTitle">Album</strong></div>
    <div class="hint">Dator: ⬅️ ➡️ • Mobil: svep</div>
  </header>

  <div class="viewer">
    <div id="book"></div>
    <div id="panLayer"></div>

    <div id="loader">
      <div style="display:grid; gap:10px; place-items:center;">
        <div id="loaderText">Läser in albumet…</div>
        <progress id="prog" max="100" value="0"></progress>
        <div id="status">0%</div>
      </div>
    </div>
  </div>

  <footer>
    <div class="controls">
      <button id="prev">← Föregående</button>
      <button id="next">Nästa →</button>
      <button id="zoomOut">– Zoom</button>
      <button id="zoomIn">+ Zoom</button>
      <button id="zoomReset" class="small">↺ Reset</button>
      <button id="fullscreen">⛶ Helskärm</button>
      <button id="backBtn" class="small" onclick="location.href='index.html'">🏠 Tillbaka</button>
    </div>
    <div class="hint">
      Sida <span id="page">–</span> / <span id="pages">–</span>
    </div>
  </footer>
</div>

<script src="libs/page-flip.browser.js"></script>

<script>
(async function () {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // --- 1. Hämta album-id ---
  const params = new URLSearchParams(window.location.search);
  const albumId = params.get("album");
  if (!albumId) {
    document.getElementById("loaderText").textContent = "Inget album angivet (?album=...).";
    return;
  }

  // --- 2. Läs config.json ---
  let config;
  try {
    const res = await fetch(`${albumId}/config.json`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    config = await res.json();
  } catch (e) {
    console.error(e);
    document.getElementById("loaderText").textContent = "Kunde inte läsa albumets konfiguration.";
    return;
  }

  const title      = config.title || albumId;
  const PAGE_COUNT = config.pageCount || 0;
  const IMAGE_PATH = config.imagePath || "images";
  const pattern    = config.filePattern || "page-{n}.jpg";

  function buildFileName(i) {
    const n   = String(i);
    const nn  = n.padStart(2, "0");
    const nnn = n.padStart(3, "0");
    return pattern
      .replace("{nnn}", nnn)
      .replace("{nn}",  nn)
      .replace("{n}",   n);
  }

  const FILE_PATTERN = i => `${albumId}/${IMAGE_PATH}/${buildFileName(i)}`;

  document.getElementById("albumTitle").textContent = title;
  document.title = `${title} – bläddringsalbum`;

  const loader   = document.getElementById("loader");
  const prog     = document.getElementById("prog");
  const status   = document.getElementById("status");
  const pageEl   = document.getElementById("page");
  const pagesEl  = document.getElementById("pages");
  const bookEl   = document.getElementById("book");
  const panLayer = document.getElementById("panLayer");

  pagesEl.textContent = PAGE_COUNT.toString();

  // --- 3. Preload första sidor ---
  const FIRST_PRELOAD = 8;
  const images = Array.from({ length: PAGE_COUNT }, (_, idx) => FILE_PATTERN(idx + 1));
  let loaded = 0;

  function preloadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = resolve;
      img.onerror = resolve;
      img.src = src;
    }).then(() => {
      loaded++;
      const need = Math.min(FIRST_PRELOAD, PAGE_COUNT) || 1;
      const pct = Math.round((loaded / need) * 100);
      prog.value = pct;
      status.textContent = pct + "%";
    });
  }

  await Promise.all(images.slice(0, FIRST_PRELOAD).map(preloadImage));
  prog.value = 100;
  status.textContent = "100%";

  if (!window.St || !St.PageFlip) {
    loader.innerHTML = "<div style='text-align:center'>Kan inte starta blädderalbumet (PageFlip saknas).</div>";
    return;
  }

  // --- 4. Initiera PageFlip ---
  const pageFlip = new St.PageFlip(bookEl, {
    width: 800,
    height: 1100,
    size: "stretch",   // anpassa inne i #book (som är begränsad av viewer)
    minWidth: 300,
    minHeight: 400,
    maxWidth: 2000,
    maxHeight: 2600,
    showCover: true,
    drawShadow: true,
    autoSize: true,
    mobileScrollSupport: false
  });

  pageFlip.loadFromImages(images);
  loader.style.display = "none";

  pageEl.textContent = (pageFlip.getCurrentPageIndex() + 1).toString();
  pageFlip.on("flip", e => {
    pageEl.textContent = (e.data + 1).toString();
  });

  // --- 5. Zoom + panorering ---
  let zoom = 1;
  let panX = 0;
  let panY = 0;

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;
    panLayer.style.pointerEvents = "none";
    bookEl.style.transformOrigin = "center center";
    bookEl.style.transform = "translate(0px, 0px) scale(1)";
  }

  function updateTransform() {
    const w = bookEl.clientWidth;
    const h = bookEl.clientHeight;

    if (zoom <= 1) {
      resetView();
      return;
    }

    const maxX = (w * (zoom - 1)) / 2;
    const maxY = (h * (zoom - 1)) / 2;

    panX = clamp(panX, -maxX, maxX);
    panY = clamp(panY, -maxY, maxY);

    panLayer.style.pointerEvents = "auto";
    bookEl.style.transformOrigin = "center center";
    bookEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  document.getElementById("zoomIn").addEventListener("click", () => {
    zoom = clamp(zoom + 0.2, 1, 2.5);
    updateTransform();
  });

  document.getElementById("zoomOut").addEventListener("click", () => {
    zoom = clamp(zoom - 0.2, 1, 2.5);
    updateTransform();
  });

  document.getElementById("zoomReset").addEventListener("click", () => {
    resetView();
  });

  // Pan via pointerevents
  let isPanning = false;
  let startX = 0;
  let startY = 0;
  let startPanX = 0;
  let startPanY = 0;
  let activePointerId = null;

  panLayer.addEventListener("pointerdown", e => {
    if (zoom <= 1) return;
    isPanning = true;
    activePointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = panX;
    startPanY = panY;
    e.preventDefault();
    e.stopPropagation();
    panLayer.setPointerCapture(activePointerId);
  });

  panLayer.addEventListener("pointermove", e => {
    if (!isPanning || e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    panX = startPanX + dx;
    panY = startPanY + dy;
    updateTransform();
  });

  function endPan(e) {
    if (!isPanning || (activePointerId !== null && e.pointerId !== activePointerId)) return;
    isPanning = false;
    if (activePointerId !== null) {
      try { panLayer.releasePointerCapture(activePointerId); } catch (_) {}
    }
    activePointerId = null;
  }

  panLayer.addEventListener("pointerup", endPan);
  panLayer.addEventListener("pointercancel", endPan);
  panLayer.addEventListener("pointerleave", e => {
    if (!isPanning) return;
    endPan(e);
  });

  // --- 6. Resize: låt PageFlip anpassa sig, behåll vy ---
  window.addEventListener("resize", () => {
    pageFlip.update();
    // Behåll zoom/pan, men se till att albumet fortfarande ryms
    updateTransform();
  });

  // --- 7. Helskärm bara på icke-touch (desktop) ---
  const fullscreenBtn = document.getElementById("fullscreen");
  const isTouchDevice = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
  if (isTouchDevice) {
    fullscreenBtn.style.display = "none";
  } else {
    fullscreenBtn.addEventListener("click", () => {
      const el = document.documentElement;
      if (!document.fullscreenElement &&
          !document.webkitFullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
  }

  // --- 8. Navigering + tangentbord ---
  document.getElementById("prev").addEventListener("click", () => pageFlip.flipPrev());
  document.getElementById("next").addEventListener("click", () => pageFlip.flipNext());

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft")  pageFlip.flipPrev();
    if (e.key === "ArrowRight") pageFlip.flipNext();
    if (e.key === "+") { zoom = clamp(zoom + 0.2, 1, 2.5); updateTransform(); }
    if (e.key === "-") { zoom = clamp(zoom - 0.2, 1, 2.5); updateTransform(); }
  });

})();
</script>
</body>
</html>
