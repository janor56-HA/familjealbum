<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Familjealbum – bläddringsvisning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;          /* exakt fönsterhöjd */
      overflow: hidden;       /* ingen scroll utanför albumet */
      background: #050505;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: contain;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;  /* header överst, viewer i mitten, footer nederst */
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }

    header, footer {
      padding: 8px 12px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #222;
    }

    footer {
      border-bottom: none;
      border-top: 1px solid #222;
    }

    header > div:first-child {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header .hint {
      font-size: 0.8rem;
      opacity: 0.75;
      text-align: right;
    }

    .viewer {
      position: relative;
      overflow: hidden;        /* inget eget scroll här */
      display: grid;
      place-items: center;
      padding: 6px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;

      flex: 1 1 auto;          /* fyll utrymmet mellan header och footer */
      min-height: 0;           /* viktigt i flexlayout för att få krympa */
    }

    #book {
      width: 100%;
      height: 100%;         /* fyll viewer-ytan */
      max-width: 1400px;
      margin: 0 auto;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s ease-out;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    #panLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;  /* slås på i JS när zoom > 1 */
      touch-action: none;    /* hindra browser-scroll / långtryck */
      -webkit-user-select: none;
      user-select: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      background: #252525;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    button:hover { background: #333; }
    button:active { transform: scale(0.97); }

    .hint {
      opacity: 0.8;
      font-size: 0.85rem;
    }

    #loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(20,20,20,.9) 0, rgba(0,0,0,.85) 60%);
      color: #ddd;
      font-size: 1rem;
      z-index: 10;
      text-align: center;
      padding: 16px;
    }

    progress {
      width: 240px;
      max-width: 70vw;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }

    progress::-webkit-progress-bar { background-color: #333; }
    progress::-webkit-progress-value { background-color: #f0f0f0; }
    progress::-moz-progress-bar { background-color: #f0f0f0; }

    @media (max-width: 768px) {
      header, footer {
        flex-direction: column;
        align-items: stretch;
      }
      header > div:first-child { justify-content: center; }
      header .hint { text-align: center; }
      .controls { justify-content: center; }
      button {
        flex: 1 1 auto;
        justify-content: center;
      }

      #book {
        max-width: 100%;
        height: 100%;    /* fortfarande fylla viewer, ingen max-height */
      }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>📖 <strong id="albumTitle">Album</strong></div>
    <div class="hint">
      Dator: bläddra med mus eller ⬅️ ➡️ • Mobil: svep med fingret
    </div>
  </header>

  <div class="viewer">
    <div id="book"></div>
    <div id="panLayer"></div>

    <div id="loader">
      <div style="display:grid; gap:10px; place-items:center;">
        <div id="loaderText">Läser in albumet…</div>
        <progress id="prog" max="100" value="0"></progress>
        <div id="status">0%</div>
        <div style="font-size:0.8rem; opacity:0.8;">
          Första gången kan det ta några sekunder, särskilt på mobil.
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="controls">
      <button id="prev">← Föregående</button>
      <button id="next">Nästa →</button>
      <button id="zoomOut">– Zoom</button>
      <button id="zoomIn">+ Zoom</button>
      <button id="zoomReset">↺ Reset zoom</button>
      <button id="fullscreen">⛶ Helskärm</button>
      <button onclick="location.href='index.html'">🏠 Tillbaka</button>
    </div>
    <div class="hint">
      Sida <span id="page">–</span> / <span id="pages">–</span>
    </div>
  </footer>
</div>

<script src="libs/page-flip.browser.js"></script>

<script>
(async function () {
  // --- Hjälpfunktion för clamp ---
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // 1. Hämta album-id från querystring
  const params = new URLSearchParams(window.location.search);
  const albumId = params.get("album");

  if (!albumId) {
    document.getElementById("loaderText").textContent = "Inget album angivet (?album=...).";
    throw new Error("No album id");
  }

  // 2. Läs config.json i album-mappen
  const configUrl = `${albumId}/config.json`;
  let config;
  try {
    const res = await fetch(configUrl);
    if (!res.ok) throw new Error("HTTP " + res.status);
    config = await res.json();
  } catch (e) {
    document.getElementById("loaderText").textContent = "Kunde inte läsa albumets konfiguration.";
    console.error("Config-fel:", e);
    return;
  }

  const title      = config.title || albumId;
  const PAGE_COUNT = config.pageCount || 0;
  const IMAGE_PATH = config.imagePath || "images";
  const pattern    = config.filePattern || "page-{n}.jpg";

  // Skapa filnamnsfunktion utifrån pattern
  function buildFileName(i) {
    const n   = String(i);
    const nn  = String(i).padStart(2, "0");
    const nnn = String(i).padStart(3, "0");
    return pattern
      .replace("{nnn}", nnn)
      .replace("{nn}", nn)
      .replace("{n}", n);
  }

  const FILE_PATTERN = i => `${albumId}/${IMAGE_PATH}/${buildFileName(i)}`;

  // 3. Sätt titel i UI
  document.getElementById("albumTitle").textContent = title;
  document.title = `${title} – bläddringsalbum`;

  const loader   = document.getElementById('loader');
  const prog     = document.getElementById('prog');
  const status   = document.getElementById('status');
  const pageEl   = document.getElementById('page');
  const pagesEl  = document.getElementById('pages');
  const bookEl   = document.getElementById('book');
  const panLayer = document.getElementById('panLayer');

  pagesEl.textContent = PAGE_COUNT.toString();

  const FIRST_PRELOAD = 8;
  const images = Array.from({ length: PAGE_COUNT }, (_, idx) =>
    FILE_PATTERN(idx + 1)
  );

  let loaded = 0;

  function preloadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(src);
      img.onerror = () => {
        console.error("Kunde inte ladda bild:", src);
        resolve(src);
      };
      img.src = src;
    }).then(src => {
      loaded++;
      const need = Math.min(FIRST_PRELOAD, PAGE_COUNT) || 1;
      const percent = Math.round((loaded / need) * 100);
      prog.value = percent;
      status.textContent = percent + "%";
      return src;
    });
  }

  const needToPreload = Math.min(FIRST_PRELOAD, PAGE_COUNT);
  const preloadPromises = images.slice(0, needToPreload).map(preloadImage);
  await Promise.all(preloadPromises);

  prog.value = 100;
  status.textContent = "100%";

  if (!window.St || !St.PageFlip) {
    loader.innerHTML = "<div style='text-align:center'>Kan inte starta blädderalbumet (PageFlip saknas).</div>";
    return;
  }

  const pageFlip = new St.PageFlip(bookEl, {
    width: 800,
    height: 1100,
    size: "stretch",
    minWidth: 320,
    minHeight: 400,
    maxWidth: 2000,
    maxHeight: 2600,
    drawShadow: true,
    flippingTime: 600,
    showCover: true,
    usePortrait: true,
    autoSize: true,
    startPage: 0,
    mobileScrollSupport: false
  });

  pageFlip.loadFromImages(images);

  loader.style.display = "none";
  pageEl.textContent = (pageFlip.getCurrentPageIndex() + 1).toString();

  pageFlip.on("flip", e => {
    pageEl.textContent = (e.data + 1).toString();
  });

  // --- Zoom + panorering med panLayer ---
  let zoom = 1;
  let panX = 0;
  let panY = 0;

  function updateTransform() {
    const w = bookEl.clientWidth;
    const h = bookEl.clientHeight;

    const maxOffsetX = (w * (zoom - 1)) / 2;
    const maxOffsetY = (h * (zoom - 1)) / 2;

    if (zoom <= 1) {
      zoom = 1;
      panX = 0;
      panY = 0;
      panLayer.style.pointerEvents = "none";  // svep går till PageFlip
    } else {
      panX = clamp(panX, -maxOffsetX, maxOffsetX);
      panY = clamp(panY, -maxOffsetY, maxOffsetY);
      panLayer.style.pointerEvents = "auto";  // svep går till panorering
    }

    bookEl.style.transformOrigin = "center center";
    bookEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  document.getElementById("zoomIn").addEventListener("click", () => {
    zoom = clamp(zoom + 0.2, 1, 2.5);
    updateTransform();
  });

  document.getElementById("zoomOut").addEventListener("click", () => {
    zoom = clamp(zoom - 0.2, 1, 2.5);
    updateTransform();
  });

  document.getElementById("zoomReset").addEventListener("click", () => {
    zoom = 1;
    panX = 0;
    panY = 0;
    updateTransform();
  });

  // Panorera genom att dra på panLayer när man är inzoomad
  let isPanning = false;
  let startX = 0;
  let startY = 0;
  let startPanX = 0;
  let startPanY = 0;
  let activePointerId = null;

  panLayer.addEventListener("pointerdown", (e) => {
    if (zoom <= 1) return; // ingen pan om inte inzoomad

    isPanning = true;
    activePointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = panX;
    startPanY = panY;

    e.preventDefault();
    e.stopPropagation();

    panLayer.setPointerCapture(activePointerId);
  });

  panLayer.addEventListener("pointermove", (e) => {
    if (!isPanning || e.pointerId !== activePointerId) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    panX = startPanX + dx;
    panY = startPanY + dy;

    updateTransform();
  });

  function endPan(e) {
    if (!isPanning || (activePointerId !== null && e.pointerId !== activePointerId)) return;
    isPanning = false;
    if (activePointerId !== null) {
      try { panLayer.releasePointerCapture(activePointerId); } catch (_) {}
    }
    activePointerId = null;
  }

  panLayer.addEventListener("pointerup", endPan);
  panLayer.addEventListener("pointercancel", endPan);
  panLayer.addEventListener("pointerleave", (e) => {
    if (!isPanning) return;
    endPan(e);
  });

  // --- Resize / rotation: uppdatera både PageFlip och vår transform ---
  window.addEventListener("resize", () => {
    pageFlip.update();
    // Vid rotation/resize: återställ vy så hela sidan syns
    zoom = 1;
    panX = 0;
    panY = 0;
    updateTransform();
  });

  // Helskärm
  document.getElementById("fullscreen").addEventListener("click", () => {
    const el = document.documentElement;

    const requestFullScreen =
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.webkitRequestFullScreen || // vissa WebKit-varianter
      el.msRequestFullscreen;

    const exitFullScreen =
      document.exitFullscreen ||
      document.webkitExitFullscreen ||
      document.webkitCancelFullScreen ||
      document.msExitFullscreen;

    // Om API inte stöds: tala om det och gör inget mer
    if (!requestFullScreen || !exitFullScreen) {
      alert("Helskärm stöds tyvärr inte i den här webbläsaren på denna enhet.");
      return;
    }

    const isFull =
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.msFullscreenElement;

    if (!isFull) {
      requestFullScreen.call(el);
    } else {
      exitFullScreen.call(document);
    }
  });

  // Tangentbord (desktop)
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft")  pageFlip.flipPrev();
    if (e.key === "ArrowRight") pageFlip.flipNext();
    if (e.key === "+") { zoom = clamp(zoom + 0.2, 1, 2.5); updateTransform(); }
    if (e.key === "-") { zoom = clamp(zoom - 0.2, 1, 2.5); updateTransform(); }
  });

})();
</script>
</body>
</html>
