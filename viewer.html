<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Familjealbum – bläddringsvisning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050505;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; /* vi använder bara viewer-scroll på mobil */
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }

    header {
      padding: 8px 12px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    header > div:first-child {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header .hint {
      font-size: 0.8rem;
      opacity: 0.75;
      white-space: nowrap;
    }

    .viewer {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;         /* desktop: inget scroll här */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 6px 6px 80px;    /* lite luft under albumet */
    }

    #book {
      width: 100%;
      max-width: 1400px;
      height: auto;             /* PageFlip styr höjd/aspekt */
      margin: 0 auto;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s ease-out;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;       /* vi styr drag själva i zoom-läge */
    }

    #panLayer {
      position: fixed;          /* ligger ovanpå #book visuellt */
      inset: 0;
      pointer-events: none;     /* aktiveras i JS när zoom > 1 */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      z-index: 5;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(20,20,20,.9) 0, rgba(0,0,0,.85) 60%);
      color: #ddd;
      font-size: 1rem;
      z-index: 10;
      text-align: center;
      padding: 16px;
    }

    progress {
      width: 240px;
      max-width: 70vw;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }
    progress::-webkit-progress-bar { background-color: #333; }
    progress::-webkit-progress-value { background-color: #f0f0f0; }
    progress::-moz-progress-bar { background-color: #f0f0f0; }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 6px 8px;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      z-index: 20;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      flex: 1 1 auto;
    }

    button {
      background: #252525;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      white-space: nowrap;
    }

    button.small {
      padding: 3px 8px;
      font-size: 0.75rem;
    }

    button:hover { background: #333; }
    button:active { transform: scale(0.97); }

    footer .hint {
      font-size: 0.75rem;
      opacity: 0.85;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Overlay för att "stänga av" landskap på mobil */
    .rotate-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      color: #f5f5f5;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 100;
      padding: 20px;
      font-size: 1rem;
    }

    .rotate-overlay span {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    body.force-portrait .rotate-overlay {
      display: flex;
    }

    body.force-portrait .viewer,
    body.force-portrait footer {
      visibility: hidden; /* dölj album + knappar i landskap på touch-enheter */
    }

    @media (max-width: 768px) {
      header {
        padding: 6px 8px;
      }

      header .hint {
        display: none;       /* spara lite höjd på mobil */
      }

      /* Mobil: vi vill kunna scrolla viewer för att se top/botten */
      .viewer {
        overflow: auto;
        padding-bottom: 100px;  /* extra luft pga två-radig footer */
      }

      /* Footer i två "rader": knappar överst, sidinfo under */
      footer {
        padding: 6px 6px;
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        justify-content: center;
        flex-wrap: wrap;    /* tillåt två rader knappar */
      }

      button {
        font-size: 0.8rem;
        padding: 4px 8px;
      }

      button.small {
        font-size: 0.7rem;
        padding: 3px 6px;
      }

      #book {
        max-width: 100%;
      }

      footer .hint {
        text-align: center;
        font-size: 0.7rem;
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>📖 <strong id="albumTitle">Album</strong></div>
    <div class="hint">Dator: ⬅️ ➡️ • Mobil: svep</div>
  </header>

  <div class="viewer" id="viewer">
    <div id="book"></div>
  </div>

  <!-- Pan-lager och loader ligger "ovanpå" -->
  <div id="panLayer"></div>
  <div id="loader">
    <div style="display:grid; gap:10px; place-items:center;">
      <div id="loaderText">Läser in albumet…</div>
      <progress id="prog" max="100" value="0"></progress>
      <div id="status">0%</div>
    </div>
  </div>

  <!-- Overlay för mobil-landskap -->
  <div class="rotate-overlay" id="rotateOverlay">
    <div>
      <span>📱↻</span>
      <div>Vänd telefonen till stående läge för att se albumet.</div>
    </div>
  </div>

  <footer>
    <div class="controls">
      <button id="prev">← Föregående</button>
      <button id="next">Nästa →</button>
      <button id="zoomOut">– Zoom</button>
      <button id="zoomIn">+ Zoom</button>
      <button id="zoomReset" class="small">↺ Reset</button>
      <button id="fullscreen">⛶ Helskärm</button>
      <button id="backBtn" class="small" onclick="location.href='index.html'">🏠 Tillbaka</button>
    </div>
    <div class="hint">
      Sida <span id="page">–</span> / <span id="pages">–</span>
    </div>
  </footer>
</div>

<script src="libs/page-flip.browser.js"></script>

<script>
(async function () {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const viewerEl = document.getElementById("viewer");

  // --- 1. Album-id ---
  const params = new URLSearchParams(window.location.search);
  const albumId = params.get("album");
  if (!albumId) {
    document.getElementById("loaderText").textContent = "Inget album angivet (?album=...).";
    return;
  }

  // --- 2. Läs config.json ---
  let config;
  try {
    const res = await fetch(`${albumId}/config.json`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    config = await res.json();
  } catch (e) {
    console.error(e);
    document.getElementById("loaderText").textContent = "Kunde inte läsa albumets konfiguration.";
    return;
  }

  const title      = config.title || albumId;
  const PAGE_COUNT = config.pageCount || 0;
  const IMAGE_PATH = config.imagePath || "images";
  const pattern    = config.filePattern || "page-{n}.jpg";

  function buildFileName(i) {
    const n   = String(i);
    const nn  = n.padStart(2, "0");
    const nnn = n.padStart(3, "0");
    return pattern
      .replace("{nnn}", nnn)
      .replace("{nn}",  nn)
      .replace("{n}",   n);
  }

  const FILE_PATTERN = i => `${albumId}/${IMAGE_PATH}/${buildFileName(i)}`;

  document.getElementById("albumTitle").textContent = title;
  document.title = `${title} – bläddringsalbum`;

  const loader   = document.getElementById("loader");
  const prog     = document.getElementById("prog");
  const status   = document.getElementById("status");
  const pageEl   = document.getElementById("page");
  const pagesEl  = document.getElementById("pages");
  const bookEl   = document.getElementById("book");
  const panLayer = document.getElementById("panLayer");

  pagesEl.textContent = PAGE_COUNT.toString();

  // --- 3. Preload första sidor ---
  const FIRST_PRELOAD = 8;
  const images = Array.from({ length: PAGE_COUNT }, (_, idx) => FILE_PATTERN(idx + 1));
  let loaded = 0;

  function preloadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = resolve;
      img.onerror = resolve;
      img.src = src;
    }).then(() => {
      loaded++;
      const need = Math.min(FIRST_PRELOAD, PAGE_COUNT) || 1;
      const pct = Math.round((loaded / need) * 100);
      prog.value = pct;
      status.textContent = pct + "%";
    });
  }

  await Promise.all(images.slice(0, FIRST_PRELOAD).map(preloadImage));
  prog.value = 100;
  status.textContent = "100%";

  if (!window.St || !St.PageFlip) {
    loader.innerHTML = "<div style='text-align:center'>Kan inte starta blädderalbumet (PageFlip saknas).</div>";
    return;
  }

  // --- 4. Initiera PageFlip ---
  const pageFlip = new St.PageFlip(bookEl, {
    width: 800,
    height: 1100,
    size: "stretch",
    minWidth: 300,
    minHeight: 400,
    maxWidth: 2000,
    maxHeight: 2600,
    showCover: true,
    drawShadow: true,
    autoSize: true,
    mobileScrollSupport: false
  });

  pageFlip.loadFromImages(images);
  loader.style.display = "none";

  pageEl.textContent = (pageFlip.getCurrentPageIndex() + 1).toString();
  pageFlip.on("flip", e => {
    pageEl.textContent = (e.data + 1).toString();
  });

  // --- 5. Zoom + pan ---
  let zoom = 1;
  let panX = 0;
  let panY = 0;

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;
    panLayer.style.pointerEvents = "none";
    bookEl.style.transformOrigin = "center center";
    bookEl.style.transform = "translate(0px, 0px) scale(1)";
  }

  function updateTransform() {
    const rect = bookEl.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;

    if (zoom <= 1) {
      resetView();
      return;
    }

    const maxX = (w * (zoom - 1)) / 2;
    const maxY = (h * (zoom - 1)) / 2;

    panX = clamp(panX, -maxX, maxX);
    panY = clamp(panY, -maxY, maxY);

    panLayer.style.pointerEvents = "auto";
    bookEl.style.transformOrigin = "center center";
    bookEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  document.getElementById("zoomIn").addEventListener("click", () => {
    zoom = clamp(zoom + 0.2, 1, 2.5);
    updateTransform();
  });

  document.getElementById("zoomOut").addEventListener("click", () => {
    zoom = clamp(zoom - 0.2, 1, 2.5);
    updateTransform();
  });

  document.getElementById("zoomReset").addEventListener("click", () => {
    resetView();
  });

  // Pan med pointerhändelser (när zoom > 1)
  let isPanning = false;
  let startX = 0;
  let startY = 0;
  let startPanX = 0;
  let startPanY = 0;
  let activePointerId = null;

  panLayer.addEventListener("pointerdown", e => {
    if (zoom <= 1) return;
    isPanning = true;
    activePointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = panX;
    startPanY = panY;
    e.preventDefault();
    e.stopPropagation();
    panLayer.setPointerCapture(activePointerId);
  });

  panLayer.addEventListener("pointermove", e => {
    if (!isPanning || e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    panX = startPanX + dx;
    panY = startPanY + dy;
    updateTransform();
  });

  function endPan(e) {
    if (!isPanning || (activePointerId !== null && e.pointerId !== activePointerId)) return;
    isPanning = false;
    if (activePointerId !== null) {
      try { panLayer.releasePointerCapture(activePointerId); } catch (_) {}
    }
    activePointerId = null;
  }

  panLayer.addEventListener("pointerup", endPan);
  panLayer.addEventListener("pointercancel", endPan);
  panLayer.addEventListener("pointerleave", e => {
    if (!isPanning) return;
    endPan(e);
  });

  // --- 6. Resize: uppdatera PageFlip, håll zoom inom rimliga gränser ---
  window.addEventListener("resize", () => {
    pageFlip.update();
    if (zoom > 1) updateTransform();
    updateOrientationOverlay();
  });

  // --- 7. Helskärm bara desktop, och fixa scroll där ---
  const fullscreenBtn = document.getElementById("fullscreen");
  const isTouchDevice = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

  if (isTouchDevice) {
    fullscreenBtn.style.display = "none";
  } else {
    fullscreenBtn.addEventListener("click", () => {
      const el = document.documentElement;
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFull) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      // Nollställ scroll i viewer + vy när vi går in/ur helskärm
      viewerEl.scrollTop = 0;
      viewerEl.scrollLeft = 0;
      resetView();
    });
  }

  // --- 8. Navigering + tangentbord ---
  document.getElementById("prev").addEventListener("click", () => pageFlip.flipPrev());
  document.getElementById("next").addEventListener("click", () => pageFlip.flipNext());

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft")  pageFlip.flipPrev();
    if (e.key === "ArrowRight") pageFlip.flipNext();
    if (e.key === "+") { zoom = clamp(zoom + 0.2, 1, 2.5); updateTransform(); }
    if (e.key === "-") { zoom = clamp(zoom - 0.2, 1, 2.5); updateTransform(); }
  });

  // --- 9. Stäng av mobil-landskap med overlay ---
  const rotateOverlay = document.getElementById("rotateOverlay");

  function updateOrientationOverlay() {
    if (!isTouchDevice) {
      document.body.classList.remove("force-portrait");
      return;
    }
    const isLandscape = window.innerWidth > window.innerHeight;
    if (isLandscape) {
      document.body.classList.add("force-portrait");
    } else {
      document.body.classList.remove("force-portrait");
    }
  }

  updateOrientationOverlay();

})();
</script>
</body>
</html>
